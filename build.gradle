plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

subprojects {
	apply plugin: 'java-library'

	version = mod_version
	group = maven_group

	base {
		// frostbear-fabric-26.2-<version>.jar, frostbear-neoforge-26.2-<version>.jar
		archivesName = "${mod_id}-${project.name}-${minecraft_version}"
	}

	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
	}

	java {
		toolchain.languageVersion = JavaLanguageVersion.of(25)
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 25
	}

	tasks.named('jar', Jar) {
		from(rootProject.file('LICENSE')) {
			rename { "${it}_${mod_id}" }
		}
	}
}

// Shared by the fabric and neoforge builds: compile and package the common
// module's sources and resources into each loader jar.
configure([project(':fabric'), project(':neoforge')]) {
	evaluationDependsOn(':common')
	def common = project(':common')

	dependencies {
		// Lets IDEs resolve common classes; the classes themselves are compiled below.
		compileOnly(common) {
			transitive = false
		}
	}

	tasks.named('compileJava', JavaCompile) {
		source(common.sourceSets.main.java)
	}

	tasks.named('processResources', ProcessResources) {
		from(common.sourceSets.main.resources)
	}

	tasks.named('sourcesJar', Jar) {
		from(common.sourceSets.main.allSource)
	}
}
