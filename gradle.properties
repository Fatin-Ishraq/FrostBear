org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.2
minecraft_version_range=[26.2]
# Vanilla game used to compile the common module
neoform_version=26.2-2

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.2
loom_version=1.17-SNAPSHOT

# NeoForge
neo_version=26.2.0.90
moddev_version=2.0.148

# Mixin annotations for the common module (the loaders provide Mixin at runtime)
mixin_version=0.17.5+mixin.0.8.7

# Mod
mod_id=frostbear
mod_name=FrostBear
mod_license=MIT
mod_version=2.0.0-alpha.1
maven_group=com.example
