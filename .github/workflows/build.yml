name: Build

on:
  push:
    branches: [main, 'multiloader/**']
  pull_request:
    branches: [main, 'multiloader/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build FrostBear
        run: ./gradlew build --no-daemon

      - name: Run game tests
        run: ./gradlew :fabric:runGametest :neoforge:runGameTestServer --no-daemon

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: frostbear-fabric-26.2
          path: fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: frostbear-neoforge-26.2
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
